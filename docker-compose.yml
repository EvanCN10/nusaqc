version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nusaqc-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=NusaQC Backend
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///./nusaqc.db
      - ENABLE_MOCK_HARDWARE=true
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8000"]
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/models_weights:/app/models_weights
      - ./backend/nusaqc.db:/app/nusaqc.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nusaqc-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/events
    depends_on:
      - backend
    restart: unless-stopped
